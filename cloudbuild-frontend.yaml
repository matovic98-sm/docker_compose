
steps:
  # Build the frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'VITE_API_URL=https://recipe-backend-810839230425.us-central1.run.app', '-t', 'gcr.io/$PROJECT_ID/app-frontend', './frontend']

  # Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/app-frontend']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'recipe-frontend',
      '--image', 'gcr.io/$PROJECT_ID/app-frontend',
      '--platform', 'managed',
      '--region', 'us-central1',
      '--allow-unauthenticated',
      '--port', '80'
    ]

# Add logging configuration
options:
  logging: CLOUD_LOGGING_ONLY
